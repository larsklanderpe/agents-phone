services:
  - type: web
    name: work-notes-bridge
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    rootDir: _bridge
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    numInstances: 1
    disk:
      name: work-notes-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: DATABASE_PATH
        value: /var/data/work-notes.sqlite
      - key: SMS_ENABLED
        value: "false"
      - key: A2P_APPROVED
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: SLACK_TEAM_ID
        sync: false
      - key: SLACK_APP_ID
        sync: false
      - key: SLACK_BOT_ID
        sync: false
      - key: SLACK_ALLOWED_USER_IDS
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_NUMBER
        sync: false
      - key: ALLOWED_PHONE_NUMBERS
        sync: false
      - key: TALLY_FORM_ID
        sync: false
      - key: TALLY_SIGNING_SECRET
        sync: false
      - key: TALLY_FIELD_KEYS
        value: "{}"
