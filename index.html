<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klander Family — CR Rental Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }

    #sidebar {
      width: 210px; flex-shrink: 0;
      background: #17314f; color: #fff;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .sidebar-header h1 {
      font-size: 0.92rem; font-weight: 700;
      letter-spacing: 0.02em; line-height: 1.4;
    }
    .sidebar-header .sub { font-size: 0.72rem; opacity: 0.6; margin-top: 3px; }

    nav { padding: 10px 0; flex: 1; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; cursor: pointer;
      border-left: 3px solid transparent;
      font-size: 0.84rem; opacity: 0.8;
      transition: background 0.12s, opacity 0.12s;
      user-select: none;
    }
    .nav-item:hover { opacity: 1; background: rgba(255,255,255,0.06); }
    .nav-item.active {
      opacity: 1; font-weight: 600;
      border-left-color: #0e7c7b;
      background: rgba(14,124,123,0.18);
    }
    .nav-item .icon { font-size: 1.15rem; flex-shrink: 0; }
    .nav-item .label { line-height: 1.3; }
    .nav-item .sub   { font-size: 0.69rem; opacity: 0.6; margin-top: 1px; }

    .sidebar-footer {
      padding: 12px 16px;
      font-size: 0.68rem; opacity: 0.4;
      border-top: 1px solid rgba(255,255,255,0.1);
      line-height: 1.5;
    }

    #content { flex: 1; overflow: hidden; position: relative; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>🏡 CR Rental<br>Tracker</h1>
      <div class="sub">Klander Family</div>
    </div>
    <nav id="nav">
      <div class="nav-item active" data-src="nicoya-rental-tracker/index.html">
        <span class="icon">🏖</span>
        <div><div class="label">Nicoya Peninsula</div><div class="sub">Nosara · Sámara</div></div>
      </div>
      <div class="nav-item" data-src="norte-guanacaste-rental-tracker/index.html">
        <span class="icon">🌊</span>
        <div><div class="label">Norte Guanacaste</div><div class="sub">Tamarindo · Flamingo</div></div>
      </div>
      <div class="nav-item" data-src="south-pacific-rental-tracker/index.html">
        <span class="icon">🌿</span>
        <div><div class="label">South Pacific</div><div class="sub">Dominical · Uvita</div></div>
      </div>
      <div class="nav-item" data-src="central-valley-rental-tracker/index.html">
        <span class="icon">🏞️</span>
        <div><div class="label">Central Valley</div><div class="sub">Escazú · Heredia</div></div>
      </div>
    </nav>
    <div class="sidebar-footer">
      Updated June 19, 2026<br>by Claude
    </div>
  </div>
  <div id="content">
    <iframe id="frame" src="nicoya-rental-tracker/index.html" title="Rental Tracker"></iframe>
  </div>
  <script>
    const frame = document.getElementById('frame');
    document.getElementById('nav').addEventListener('click', function(e) {
      const item = e.target.closest('.nav-item');
      if (!item) return;
      document.querySelectorAll('.nav-item').forEach(function(el) {
        el.classList.remove('active');
      });
      item.classList.add('active');
      frame.src = item.dataset.src;
    });
  </script>
</body>
</html>
